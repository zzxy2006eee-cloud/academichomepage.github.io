name: Sync contributions and deploy homepage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test configuration and publishing behavior
        run: node --test tests/config.test.mjs
      - name: Restore last successful contribution snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/github.json
          key: github-snapshot-${{ github.run_id }}
          restore-keys: github-snapshot-
      - name: Sync public GitHub contributions
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs
      - name: Cache the successful snapshot
        if: steps.sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/github.json
          key: github-snapshot-${{ github.run_id }}
      - name: Check content and build
        run: |
          node scripts/check.mjs
          node scripts/build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
